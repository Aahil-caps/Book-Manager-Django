<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>

    <style>
        th,
        td {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    {% block content %}

    <h2>All Books</h2>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Published Date</th>
                <th>Availability</th>
            </tr>
        </thead>

        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.price }}</td>
                <td>{{ book.published_date }}</td>
                <td>{{ book.is_available }}</td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="5">No Books Available.</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

    {% endblock %}

</body>

</html>
